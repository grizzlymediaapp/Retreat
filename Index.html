<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quinta da Pocariça — Private retreat venue in Central Portugal</title>
<meta name="description" content="A private walled estate near Coimbra, Portugal: 7 bedrooms, pool, spa, studio spaces and 42,660 m² of grounds. Exclusive-use venue for yoga, wellness and creative retreats.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;700&display=swap');

:root{
  --plaster:#FBF7EF;
  --plaster-deep:#F3EBDD;
  --salmon:#C97C54;
  --salmon-soft:#E8B896;
  --pine:#2F4A3C;
  --pine-deep:#243A2F;
  --pool:#2B7FB0;
  --ink:#28231C;
  --ink-soft:#6B6156;
  --line:#E2D8C6;
  --radius:14px;
  --disp:'Fraunces', Georgia, 'Times New Roman', serif;
  --body:'Karla', -apple-system, 'Segoe UI', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
body{font-family:var(--body);color:var(--ink);background:var(--plaster);line-height:1.6;font-size:16.5px}
img{display:block;max-width:100%}
a{color:var(--pool)}
h1,h2,h3{font-family:var(--disp);font-weight:500;line-height:1.15}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.eyebrow{font-family:var(--body);font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--salmon);margin-bottom:14px}
section{padding:76px 0}
.section-head{max-width:640px;margin-bottom:44px}
.section-head h2{font-size:clamp(28px,4vw,40px);margin-bottom:12px}
.section-head p{color:var(--ink-soft)}

/* NAV */
nav{position:sticky;top:0;z-index:50;background:rgba(251,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{font-family:var(--disp);font-size:20px;font-weight:600;color:var(--pine);text-decoration:none;letter-spacing:.01em}
.nav-links{display:flex;gap:26px;align-items:center}
.nav-links a{color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:500}
.nav-links a:hover{color:var(--salmon)}
.nav-cta{background:var(--pine);color:#fff!important;padding:9px 18px;border-radius:100px}
.nav-cta:hover{background:var(--pine-deep);color:#fff!important}
@media(max-width:840px){.nav-links a:not(.nav-cta){display:none}}

/* HERO */
.hero{position:relative;min-height:88vh;display:flex;align-items:flex-end;color:#fff}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,25,20,.18) 0%,rgba(20,25,20,.05) 40%,rgba(20,25,20,.62) 100%)}
.hero-in{position:relative;z-index:2;padding:0 22px 64px;max-width:1120px;margin:0 auto;width:100%}
.hero .eyebrow{color:#F3D9BF}
.hero h1{font-size:clamp(38px,6.5vw,68px);max-width:14ch;margin-bottom:16px;text-wrap:balance}
.hero p{font-size:clamp(16px,2.2vw,19px);max-width:52ch;margin-bottom:26px;color:#F4EFE6}
.btn{display:inline-block;font-weight:700;font-size:15px;text-decoration:none;padding:14px 26px;border-radius:100px;transition:transform .15s ease, background .15s ease}
.btn:active{transform:scale(.98)}
.btn-salmon{background:var(--salmon);color:#fff}
.btn-salmon:hover{background:#B3663F}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.5);margin-left:10px}
.btn-ghost:hover{background:rgba(255,255,255,.24)}

/* FACTS STRIP */
.facts{background:var(--pine);color:#EDE7DA;padding:30px 0}
.facts-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;text-align:center}
.fact b{display:block;font-family:var(--disp);font-size:26px;font-weight:600;color:#fff}
.fact span{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
@media(max-width:840px){.facts-grid{grid-template-columns:repeat(3,1fr);gap:22px 10px}}

/* GALLERY */
.gallery{columns:3;column-gap:14px}
.gallery img{border-radius:var(--radius);margin-bottom:14px;width:100%}
@media(max-width:760px){.gallery{columns:2}}

/* SPACES */
.spaces{background:var(--plaster-deep)}
.space-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.space{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.space img{height:210px;width:100%;object-fit:cover}
.space-body{padding:20px 22px 24px}
.space-body h3{font-size:20px;margin-bottom:8px;color:var(--pine)}
.space-body p{font-size:15px;color:var(--ink-soft)}
@media(max-width:900px){.space-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.space-grid{grid-template-columns:1fr}}

/* JOURNEY */
.journey{list-style:none;margin:38px 0 46px;position:relative}
.journey::before{content:'';position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line)}
.journey li{position:relative;padding:0 0 22px 38px}
.journey li:last-child{padding-bottom:0}
.journey li::before{content:'';position:absolute;left:2px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--plaster);border:3px solid var(--salmon)}
.journey li:last-child::before{background:var(--salmon)}
.journey b{font-weight:700}
.journey .t{color:var(--ink-soft);font-size:14.5px}
.map-frame{border:0;width:100%;height:380px;border-radius:var(--radius);filter:saturate(.9)}
.getting-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:44px;align-items:start}
@media(max-width:840px){.getting-grid{grid-template-columns:1fr}}
.area-list{margin-top:26px;padding-left:18px;color:var(--ink-soft);font-size:15px}
.area-list li{margin-bottom:6px}

/* ADDONS */
.addon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.addon{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.addon h3{font-size:18.5px;color:var(--pine);margin-bottom:8px}
.addon p{font-size:14.5px;color:var(--ink-soft)}
.addon .tag{display:inline-block;margin-top:14px;font-size:12.5px;font-weight:700;color:var(--salmon);letter-spacing:.06em;text-transform:uppercase}
@media(max-width:900px){.addon-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.addon-grid{grid-template-columns:1fr}}

/* PRICING */
.pricing{background:var(--pine);color:#EDE7DA}
.pricing .eyebrow{color:var(--salmon-soft)}
.pricing h2{color:#fff}
.price-table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.04);border-radius:var(--radius);overflow:hidden}
.price-table th,.price-table td{padding:16px 18px;text-align:left;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px}
.price-table th{font-family:var(--body);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--salmon-soft);font-weight:700}
.price-table td b{font-family:var(--disp);font-size:19px;font-weight:600;color:#fff}
.price-note{font-size:13.5px;opacity:.75;margin-top:16px;max-width:60ch}
.price-scroll{overflow-x:auto}

/* FAQ */
.faq details{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:16.5px;padding:16px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';font-family:var(--disp);font-size:24px;color:var(--salmon);flex-shrink:0;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{padding:0 0 18px;color:var(--ink-soft);max-width:70ch}

/* CONTACT */
.contact{background:var(--plaster-deep)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px}
@media(max-width:840px){.contact-grid{grid-template-columns:1fr}}
form label{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 6px}
form input,form select,form textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:var(--body);font-size:15.5px;color:var(--ink)}
form input:focus,form select:focus,form textarea:focus{outline:2px solid var(--salmon);outline-offset:1px;border-color:var(--salmon)}
form button{margin-top:24px;border:0;cursor:pointer;width:100%}
.contact-side h3{font-size:20px;color:var(--pine);margin:22px 0 6px}
.contact-side p{color:var(--ink-soft);font-size:15px}


/* NUMBERS */
.numbers{background:var(--plaster-deep);padding:56px 0}
.numbers-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:stretch}
.numcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;text-align:center}
.numcard b{display:block;font-family:var(--disp);font-size:34px;font-weight:600;color:var(--pine)}
.numcard span{font-size:13.5px;color:var(--ink-soft)}
.numcard.hot{background:var(--pine);border-color:var(--pine)}
.numcard.hot b{color:#fff}
.numcard.hot span{color:#C9D3C6}
.num-note{text-align:center;font-size:13.5px;color:var(--ink-soft);margin-top:14px}
@media(max-width:700px){.numbers-grid{grid-template-columns:1fr}}
/* BED TABLE */
.bed-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:44px}
.bed-table th,.bed-table td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14.5px}
.bed-table th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--salmon);font-weight:700;background:var(--plaster)}
.bed-table tr:last-child td{border-bottom:0}
.bed-scroll{overflow-x:auto}
.bed-note{font-size:13.5px;color:var(--ink-soft);margin-top:12px}
/* SESSION SPECS */
.session-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.session{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.session b{display:block;font-family:var(--disp);font-size:19px;color:var(--pine);margin-bottom:8px;font-weight:600}
.session ul{list-style:none;font-size:14px;color:var(--ink-soft)}
.session li{padding:4px 0 4px 18px;position:relative}
.session li::before{content:'·';position:absolute;left:4px;color:var(--salmon);font-weight:700}
@media(max-width:900px){.session-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.session-grid{grid-template-columns:1fr}}
/* SAMPLE DAY */
.dayline{list-style:none;margin-top:10px;position:relative}
.dayline::before{content:'';position:absolute;left:64px;top:8px;bottom:8px;width:2px;background:var(--line)}
.dayline li{position:relative;padding:0 0 20px 96px;font-size:15.5px}
.dayline li:last-child{padding-bottom:0}
.dayline .hh{position:absolute;left:0;top:0;width:52px;text-align:right;font-family:var(--disp);font-size:15px;color:var(--salmon);font-weight:600}
.dayline li::before{content:'';position:absolute;left:58px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--plaster);border:3px solid var(--salmon)}
.dayline b{font-weight:700}
.dayline .t{color:var(--ink-soft)}
/* INCLUDED */
.inc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 30px;margin-top:6px;max-width:820px}
.inc-grid div{padding:10px 0 10px 30px;position:relative;font-size:15px;border-bottom:1px solid var(--line)}
.inc-grid div::before{content:'✓';position:absolute;left:2px;top:10px;color:var(--salmon);font-weight:700}
@media(max-width:640px){.inc-grid{grid-template-columns:1fr}}

footer{background:var(--pine-deep);color:#B9C4B9;padding:42px 0;font-size:14px}
.foot-in{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer .brand{color:#fff}
</style>
</head>

  </div>
</nav>
